version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    depends_on:
      - db
      - rabbitmq
      - minio
      - qdrant
    env_file:
      - .env

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: seek_clarity_db
      POSTGRES_USER: seek_clarity_user
      POSTGRES_PASSWORD: seek_clarity_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: seek_clarity_admin
      MINIO_ROOT_PASSWORD: seek_clarity_admin
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: seek_clarity_admin
      RABBITMQ_DEFAULT_PASS: seek_clarity_admin

  celery_processing:
    build:
      context: .
      dockerfile: Dockerfile.processing
    command: celery -A seekClarity_backend worker -Q document_processing --concurrency=2 --loglevel=info
    restart: always
    depends_on:
      - rabbitmq
      - db
      - minio
    env_file:
      - .env

  celery_embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    command: celery -A seekClarity_backend worker -Q embedding --concurrency=2 --loglevel=info
    restart: always
    depends_on:
      - rabbitmq
      - db
      - qdrant
      - minio
    env_file:
      - .env

  celery_chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    command: celery -A seekClarity_backend worker -Q chat_processing --concurrency=2 --loglevel=info
    restart: always
    depends_on:
      - rabbitmq
      - db
    env_file:
      - .env

volumes:
  postgres_data:
  minio_data:
  qdrant_data: